<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lunch Ticket & Scanner</title>
  <link rel="icon" type="image/jpeg" href="pvh.jpg">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col items-center justify-center p-4 font-sans">

  <main id="main-card" class="relative bg-gray-900 border border-gray-800 rounded-3xl p-6 max-w-sm w-full shadow-2xl">
    
    <button onclick="openAdminModal()" class="absolute top-4 right-4 text-gray-500 hover:text-white p-2 text-xl z-10">
      ⚙️
    </button>

    <div class="inline-block px-3 py-1 bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 text-xs font-semibold rounded-full mb-3">
      OFFICE LUNCH BOOKING
    </div>
    <h1 class="text-2xl font-black mb-6">Book Your Meal</h1>

    <form id="lunch-form" onsubmit="submitOrder(event)" class="space-y-4">
      <div>
        <label class="text-xs text-gray-400 font-semibold block mb-1 text-left">Your Name</label>
        <input type="text" id="user-name" required placeholder="Enter your name" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500" />
      </div>

      <!-- Meal Choice -->
      <div>
        <label class="text-xs text-gray-400 font-semibold block mb-2 text-left">Select Meal Preference</label>
        <div class="grid grid-cols-3 gap-2">
          <label class="flex flex-col items-center justify-center p-3 bg-gray-950 border border-gray-800 rounded-xl cursor-pointer hover:border-gray-700">
            <input type="radio" name="meal-choice" value="Veg" required class="accent-indigo-500 mb-1">
            <span class="text-[11px] font-semibold">🥗 Veg</span>
          </label>
          <label class="flex flex-col items-center justify-center p-3 bg-gray-950 border border-gray-800 rounded-xl cursor-pointer hover:border-gray-700">
            <input type="radio" name="meal-choice" value="Veg + Egg" class="accent-indigo-500 mb-1">
            <span class="text-[11px] font-semibold">🥚 + Egg</span>
          </label>
          <label class="flex flex-col items-center justify-center p-3 bg-gray-950 border border-gray-800 rounded-xl cursor-pointer hover:border-gray-700">
            <input type="radio" name="meal-choice" value="Veg + Non-Veg" class="accent-indigo-500 mb-1">
            <span class="text-[11px] font-semibold">🍗 + Meat</span>
          </label>
        </div>
      </div>

      <!-- Dynamic Day / Duration Choice -->
      <div>
        <label class="text-xs text-gray-400 font-semibold block mb-2 text-left">Select Date or Weekly Pass</label>
        
        <!-- Dynamically filled with available upcoming dates & weekly packages -->
        <div id="dynamic-days-container"></div>
      </div>

      <button type="submit" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 rounded-xl transition-colors shadow-lg shadow-indigo-600/20 text-sm mt-2">
        Generate Ticket
      </button>
    </form>

    <!-- GENERATED TICKET DISPLAY -->
    <div id="ticket-display" style="display: none;" class="flex flex-col items-center py-4">
      <div class="text-emerald-400 font-bold text-sm mb-1">✓ Booking Confirmed</div>
      <h2 id="ticket-name" class="text-xl font-black text-white">--</h2>
      <p id="ticket-meal" class="text-xs text-indigo-400 font-bold mb-1">--</p>
      <p id="ticket-duration" class="text-[10px] text-gray-400 font-bold mb-4 bg-gray-800 px-3 py-1 rounded-full text-center">--</p>
      
      <div class="bg-white p-4 rounded-2xl shadow-xl mb-4" id="qrcode"></div>
      <p class="text-[11px] text-gray-400 text-center max-w-[220px]">
        Screenshot this QR code and show it at the lunch counter for verification.
      </p>
    </div>
  </main>

  <!-- ADMIN CONTROL & SCANNER MODAL -->
  <div id="admin-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4 z-50">
    <div class="bg-gray-900 border border-gray-800 rounded-3xl p-6 max-w-sm w-full max-h-[90vh] flex flex-col overflow-y-auto">
      
      <div id="pin-screen">
        <h3 class="text-lg font-bold mb-2">Enter Admin PIN</h3>
        <p class="text-xs text-gray-400 mb-4">Default PIN is 1234</p>
        <input type="password" id="admin-pin" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2 text-center text-xl tracking-widest mb-4 focus:outline-none focus:border-indigo-500" maxlength="4" placeholder="••••" />
        <button onclick="verifyPin()" class="w-full bg-indigo-600 hover:bg-indigo-500 py-3 rounded-xl font-bold">Unlock Admin Panel</button>
      </div>

      <div id="controls-screen" class="hidden space-y-4">
        <div class="flex justify-between items-center">
          <h3 class="font-bold text-lg">Admin Verification</h3>
          <button onclick="closeAdminModal()" class="text-gray-400 text-xl font-bold">✕</button>
        </div>

        <div class="bg-gray-950 p-3 rounded-2xl border border-gray-800">
          <button id="start-scan-btn" onclick="startScanner()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-xs mb-2">
            📷 Open Camera Scanner
          </button>
          <div id="reader" class="overflow-hidden rounded-xl"></div>
          <div id="scan-result" class="mt-2 text-xs text-center font-bold"></div>
        </div>

        <div class="grid grid-cols-3 gap-2 text-center">
          <div class="bg-gray-950 p-2.5 rounded-2xl border border-gray-800">
            <div class="text-[10px] text-gray-400">Veg Total</div>
            <div id="count-veg" class="text-lg font-black text-emerald-400">0</div>
          </div>
          <div class="bg-gray-950 p-2.5 rounded-2xl border border-gray-800">
            <div class="text-[10px] text-gray-400">+ Egg Total</div>
            <div id="count-egg" class="text-lg font-black text-amber-400">0</div>
          </div>
          <div class="bg-gray-950 p-2.5 rounded-2xl border border-gray-800">
            <div class="text-[10px] text-gray-400">+ Meat Total</div>
            <div id="count-nonveg" class="text-lg font-black text-rose-400">0</div>
          </div>
        </div>

        <div>
          <div class="flex justify-between items-center mb-2">
            <span class="text-xs text-gray-400 font-semibold">Active Roster</span>
            <button onclick="resetAllData()" class="text-[10px] text-red-400 hover:underline">Clear All (End of Week)</button>
          </div>
          <div id="name-list" class="bg-gray-950 rounded-2xl border border-gray-800 p-3 max-h-40 overflow-y-auto space-y-2 text-xs">
            <div class="text-gray-500 text-center py-2">Loading...</div>
          </div>
        </div>

        <button onclick="closeAdminModal()" class="w-full bg-gray-800 hover:bg-gray-700 text-gray-300 py-2.5 rounded-xl text-xs font-semibold">Close Panel</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://hkmlqympnmbxhsbnzlet.supabase.co";
    const SUPABASE_KEY = "sb_publishable_ac1YInd8xN-k3FwZ_HDrPw_px_0qa5Z";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let html5QrcodeScanner = null;
    const todayStr = new Date().toDateString(); 

    // --- CULT-STYLE DYNAMIC DATE & WEEK RENDERER ---
    function renderDynamicDays() {
      const container = document.getElementById("dynamic-days-container");
      if (!container) return;

      const now = new Date();
      const currentHour = now.getHours();
      const isPastCutoff = currentHour >= 16; // 16:00 = 4:00 PM Cutoff
      
      const formatDate = (d) => {
        return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
      };
      const formatShortDate = (d) => {
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      };

      // 1. Single Day Pickers: capped at 4 upcoming weekdays
      // If past 4:00 PM, tomorrow is closed, so we skip tomorrow (+2 days offset)
      let upcomingWeekdays = [];
      let cur = new Date(now);
      cur.setDate(cur.getDate() + (isPastCutoff ? 2 : 1));

      while (upcomingWeekdays.length < 4) {
        const dayOfWeek = cur.getDay(); // 0 = Sun, 6 = Sat
        if (dayOfWeek !== 0 && dayOfWeek !== 6) {
          upcomingWeekdays.push(new Date(cur));
        }
        cur.setDate(cur.getDate() + 1);
      }

      let html = "";

      // Notice banner if past 4:00 PM
      if (isPastCutoff) {
        html += `
          <div class="p-2.5 bg-amber-500/10 border border-amber-500/20 rounded-xl text-amber-300 text-[11px] mb-3 flex items-center space-x-2">
            <span>⏰</span>
            <span>It is past <strong>4:00 PM</strong>. Booking for tomorrow is now closed.</span>
          </div>
        `;
      }

      html += `<div class="grid grid-cols-2 gap-2 mb-3">`;
      upcomingWeekdays.forEach((d, idx) => {
        const dateLabel = formatDate(d);
        html += `
          <label class="flex items-center p-2.5 bg-gray-950 border border-gray-800 rounded-xl cursor-pointer hover:border-gray-700">
            <input type="radio" name="duration-choice" value="${dateLabel}" ${idx === 0 ? 'checked' : ''} class="accent-indigo-500">
            <span class="ml-2 text-xs font-semibold">${dateLabel}</span>
          </label>
        `;
      });
      html += `</div>`;

      // 2. Compute "This Week" dates starting from TODAY
      const currentDayOfWeek = now.getDay(); // 0 = Sun, 1 = Mon, ..., 5 = Fri, 6 = Sat
      const diffToMon = (currentDayOfWeek === 0 ? -6 : 1 - currentDayOfWeek);
      
      let thisMon = new Date(now); thisMon.setDate(now.getDate() + diffToMon);
      let thisThu = new Date(thisMon); thisThu.setDate(thisMon.getDate() + 3);
      let thisFri = new Date(thisMon); thisFri.setDate(thisMon.getDate() + 4);

      const todayStrShort = formatShortDate(now);
      const thisThuStr = formatShortDate(thisThu);
      const thisFriStr = formatShortDate(thisFri);

      // 3. Compute "Next Week" Monday - Friday dates
      let nextMon = new Date(thisMon); nextMon.setDate(thisMon.getDate() + 7);
      let nextThu = new Date(nextMon); nextThu.setDate(nextMon.getDate() + 3);
      let nextFri = new Date(nextMon); nextFri.setDate(nextMon.getDate() + 4);

      const nextMonStr = formatShortDate(nextMon);
      const nextThuStr = formatShortDate(nextThu);
      const nextFriStr = formatShortDate(nextFri);

      let thisExclFriValue = (todayStrShort === thisThuStr) 
        ? `This Week (Excl. Fri: ${todayStrShort})` 
        : `This Week (Excl. Fri: ${todayStrShort} - ${thisThuStr})`;

      let thisInclFriValue = (todayStrShort === thisFriStr) 
        ? `This Week (Incl. Fri: ${todayStrShort})` 
        : `This Week (Incl. Fri: ${todayStrShort} - ${thisFriStr})`;

      const nextExclFriValue = `Next Week (Excl. Fri: ${nextMonStr} - ${nextThuStr})`;
      const nextInclFriValue = `Next Week (Incl. Fri: ${nextMonStr} - ${nextFriStr})`;

      html += `<div class="space-y-2 border-t border-gray-800 pt-3">`;

      if (currentDayOfWeek >= 1 && currentDayOfWeek <= 5) {
        html += `<div class="text-[11px] text-indigo-400 font-semibold mb-1">This Week Packages (Starting Today)</div>`;

        if (currentDayOfWeek <= 4) {
          html += `
            <label class="flex items-center p-3 bg-gray-950 border border-gray-800 rounded-xl cursor-pointer hover:border-gray-700">
              <input type="radio" name="duration-choice" value="${thisExclFriValue}" class="accent-indigo-500">
              <span class="ml-3 text-xs font-semibold">${thisExclFriValue}</span>
            </label>
          `;
        }

        html += `
          <label class="flex items-center p-3 bg-gray-950 border border-gray-800 rounded-xl cursor-pointer hover:border-gray-700">
            <input type="radio" name="duration-choice" value="${thisInclFriValue}" class="accent-indigo-500">
            <span class="ml-3 text-xs font-semibold">${thisInclFriValue}</span>
          </label>
        `;
      }

      html += `
          <div class="text-[11px] text-indigo-400 font-semibold mt-3 mb-1">Next Week Packages</div>
          <label class="flex items-center p-3 bg-gray-950 border border-gray-800 rounded-xl cursor-pointer hover:border-gray-700">
            <input type="radio" name="duration-choice" value="${nextExclFriValue}" class="accent-indigo-500">
            <span class="ml-3 text-xs font-semibold">Next Week (Excl. Fri: ${nextMonStr} - ${nextThuStr})</span>
          </label>
          <label class="flex items-center p-3 bg-gray-950 border border-gray-800 rounded-xl cursor-pointer hover:border-gray-700">
            <input type="radio" name="duration-choice" value="${nextInclFriValue}" class="accent-indigo-500">
            <span class="ml-3 text-xs font-semibold">Next Week (Incl. Fri: ${nextMonStr} - ${nextFriStr})</span>
          </label>
        </div>
      `;

      container.innerHTML = html;
    }

    // --- AUTO-FILL MEMORY & INIT ---
    document.addEventListener("DOMContentLoaded", () => {
      renderDynamicDays();

      const savedName = localStorage.getItem("lunch_user_name");
      const savedChoice = localStorage.getItem("lunch_meal_choice");
      const savedDuration = localStorage.getItem("lunch_duration_choice");

      if (savedName) document.getElementById("user-name").value = savedName;
      if (savedChoice) {
        const radioBtn = document.querySelector(`input[name="meal-choice"][value="${savedChoice}"]`);
        if (radioBtn) radioBtn.checked = true;
      }
      if (savedDuration) {
        const durBtn = document.querySelector(`input[name="duration-choice"][value="${savedDuration}"]`);
        if (durBtn) durBtn.checked = true;
      }
    });

    async function submitOrder(e) {
      e.preventDefault();

      const name = document.getElementById("user-name").value.trim();
      const choice = document.querySelector('input[name="meal-choice"]:checked')?.value;
      const duration = document.querySelector('input[name="duration-choice"]:checked')?.value;

      if (!name || !choice || !duration) return;

      // --- 4:00 PM CUTOFF VALIDATION ---
      const now = new Date();
      if (now.getHours() >= 16) {
        const tomorrow = new Date(now);
        tomorrow.setDate(now.getDate() + 1);
        const tomorrowFormatted = tomorrow.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

        if (duration === tomorrowFormatted) {
          alert("Booking for tomorrow closes strictly at 4:00 PM. Please select another date.");
          return;
        }
      }

      localStorage.setItem("lunch_user_name", name);
      localStorage.setItem("lunch_meal_choice", choice);
      localStorage.setItem("lunch_duration_choice", duration);

      const btn = document.getElementById("submit-btn");
      btn.disabled = true;
      btn.textContent = "Generating Ticket...";

      const { data, error } = await supabaseClient
        .from('lunch_tickets')
        .insert([{ person_name: name, menu_choice: choice, duration: duration }])
        .select()
        .single();

      if (!error && data) {
        document.getElementById("lunch-form").style.display = "none";
        document.getElementById("ticket-display").style.display = "flex";
        document.getElementById("ticket-name").textContent = data.person_name;
        document.getElementById("ticket-meal").textContent = data.menu_choice;
        document.getElementById("ticket-duration").textContent = data.duration;

        new QRCode(document.getElementById("qrcode"), { text: data.id, width: 160, height: 160 });
        confetti({ particleCount: 50, spread: 60, origin: { y: 0.8 } });
      } else {
        alert("Error creating ticket. Please try again.");
        btn.disabled = false;
        btn.textContent = "Generate Ticket";
      }
    }

    function openAdminModal() { document.getElementById("admin-modal").classList.remove("hidden"); }
    
    async function closeAdminModal() {
      if (html5QrcodeScanner) {
        try {
          if (html5QrcodeScanner.isScanning) await html5QrcodeScanner.stop();
          html5QrcodeScanner.clear();
        } catch (err) {}
        html5QrcodeScanner = null;
      }
      const resultDiv = document.getElementById("scan-result");
      if (resultDiv) resultDiv.innerHTML = "";
      document.getElementById("admin-modal").classList.add("hidden");
    }

    async function verifyPin() {
      const pin = document.getElementById("admin-pin").value;
      if (pin === "1234") { 
        document.getElementById("pin-screen").classList.add("hidden");
        document.getElementById("controls-screen").classList.remove("hidden");
        await loadAdminData();
      } else {
        alert("Wrong PIN!");
      }
    }

    function startScanner() {
      const resultDiv = document.getElementById("scan-result");
      resultDiv.textContent = "Initializing camera...";

      html5QrcodeScanner = new Html5Qrcode("reader");
      html5QrcodeScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 200, height: 200 } },
        async (decodedText) => {
          if (html5QrcodeScanner.isScanning) await html5QrcodeScanner.stop();
          resultDiv.innerHTML = `<span class="text-amber-400">Verifying Ticket...</span>`;

          const { data, error } = await supabaseClient.from('lunch_tickets').select('*').eq('id', decodedText).single();

          if (data) {
            const now = new Date();
            const todayFormatted = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
            const todayName = now.toLocaleDateString('en-US', { weekday: 'long' });
            const todayDateOnly = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

            let isDayValid = false;

            if (data.duration.includes("Week")) {
              if (data.duration.includes("Excl. Fri") && todayName === "Friday") {
                isDayValid = false;
              } else if (todayName === "Saturday" || todayName === "Sunday") {
                isDayValid = false;
              } else {
                isDayValid = true;
              }
            } else {
              isDayValid = data.duration.includes(todayDateOnly) || data.duration === todayFormatted;
            }

            if (!isDayValid) {
              resultDiv.innerHTML = `<span class="text-red-500">❌ WRONG DAY!<br>Ticket valid for: ${data.duration}</span>`;
            } else if (data.last_scanned === todayStr) {
              resultDiv.innerHTML = `<span class="text-red-400">⚠️ ALREADY SCANNED TODAY!<br>${data.person_name} (${data.menu_choice})</span>`;
            } else {
              await supabaseClient.from('lunch_tickets').update({ last_scanned: todayStr }).eq('id', data.id);
              resultDiv.innerHTML = `<span class="text-emerald-400">✅ VALID TICKET!<br>${data.person_name} - ${data.menu_choice}<br><span class="text-gray-400 text-[10px]">${data.duration}</span></span>`;
              confetti({ particleCount: 40, spread: 50 });
            }
          } else {
            resultDiv.innerHTML = `<span class="text-red-500">❌ INVALID TICKET</span>`;
          }
          await loadAdminData();
        },
        (errorMessage) => {}
      ).catch(err => {
        resultDiv.innerHTML = `<span class="text-red-400">Camera permission denied.</span>`;
      });
    }

    async function loadAdminData() {
      const { data } = await supabaseClient.from('lunch_tickets').select('*').order('created_at', { ascending: false });

      if (data) {
        let veg = 0, egg = 0, nonVeg = 0;
        const nameList = document.getElementById("name-list");
        nameList.innerHTML = "";

        if (data.length === 0) {
          nameList.innerHTML = `<div class="text-gray-500 text-center py-2">No active bookings.</div>`;
        }

        data.forEach(item => {
          if (item.menu_choice === "Veg") veg++;
          if (item.menu_choice === "Veg + Egg") egg++;
          if (item.menu_choice === "Veg + Non-Veg") nonVeg++;

          const isScannedToday = item.last_scanned === todayStr;

          const row = document.createElement("div");
          row.className = "flex justify-between items-center border-b border-gray-900 pb-2 mb-2 last:border-0 last:mb-0";
          row.innerHTML = `
            <div>
              <div class="font-medium text-gray-200">${item.person_name} <span class="text-[9px] text-gray-500 ml-1">(${item.duration})</span></div>
              <div class="text-[9px] ${isScannedToday ? 'text-emerald-400' : 'text-gray-500'}">
                ${isScannedToday ? '✓ Scanned Today' : '• Pending Today'}
              </div>
            </div>
            <span class="text-[10px] px-2 py-0.5 rounded-full bg-gray-800 text-gray-400 whitespace-nowrap">${item.menu_choice}</span>
          `;
          nameList.appendChild(row);
        });

        document.getElementById("count-veg").textContent = veg;
        document.getElementById("count-egg").textContent = egg;
        document.getElementById("count-nonveg").textContent = nonVeg;
      }
    }

    async function resetAllData() {
      if (confirm("Are you sure you want to clear ALL tickets? (Use this at the end of the week)")) {
        await supabaseClient.from('lunch_tickets').delete().neq('person_name', '');
        await loadAdminData();
      }
    }
  </script>
</body>
</html>
